name: V2
on:
  workflow_dispatch

jobs:
  rdp-access:
    runs-on: windows-latest
    steps:
      - name: Download Cloudflared
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "$env:USERPROFILE\cloudflared.exe"

      - name: Enable RDP + Disable Lock/Sleep
        env:
          RDP_USER: ${{ secrets.USER }}
          RDP_PASS: ${{ secrets.PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_USER)) {
            throw "Secret 'USER' belum diatur di Settings > Secrets and variables > Actions."
          }
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASS)) {
            throw "Secret 'PASSWORD' belum diatur di Settings > Secrets and variables > Actions."
          }

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /change monitor-timeout-ac 0

          # Logon otomatis - password disimpan sebagai LSA secret (terenkripsi),
          # bukan DefaultPassword plaintext di registry.
          $lsaSrc = @'
          using System;
          using System.Runtime.InteropServices;
          public static class LsaAutologon {
            [StructLayout(LayoutKind.Sequential)]
            public struct LSA_UNICODE_STRING { public ushort Length; public ushort MaximumLength; public IntPtr Buffer; }
            [StructLayout(LayoutKind.Sequential)]
            public struct LSA_OBJECT_ATTRIBUTES { public int Length; public IntPtr RootDirectory; public IntPtr ObjectName; public uint Attributes; public IntPtr SecurityDescriptor; public IntPtr SecurityQualityOfService; }
            [DllImport("advapi32.dll")]
            static extern uint LsaOpenPolicy(IntPtr SystemName, ref LSA_OBJECT_ATTRIBUTES ObjectAttributes, uint DesiredAccess, out IntPtr PolicyHandle);
            [DllImport("advapi32.dll", EntryPoint="LsaStorePrivateData")]
            static extern uint Store(IntPtr PolicyHandle, ref LSA_UNICODE_STRING KeyName, IntPtr PrivateData);
            [DllImport("advapi32.dll")]
            static extern uint LsaNtStatusToWinError(uint Status);
            [DllImport("advapi32.dll")]
            static extern uint LsaClose(IntPtr PolicyHandle);
            static LSA_UNICODE_STRING Us(string s){
              var u = new LSA_UNICODE_STRING();
              u.Buffer = Marshal.StringToHGlobalUni(s);
              u.Length = (ushort)(s.Length * 2);
              u.MaximumLength = (ushort)((s.Length + 1) * 2);
              return u;
            }
            public static uint Set(string name, string value){
              var oa = new LSA_OBJECT_ATTRIBUTES();
              oa.Length = Marshal.SizeOf(typeof(LSA_OBJECT_ATTRIBUTES));
              IntPtr h;
              uint st = LsaOpenPolicy(IntPtr.Zero, ref oa, 0x00000020, out h); // POLICY_CREATE_SECRET
              if (st != 0) return LsaNtStatusToWinError(st);
              var kn = Us(name);
              uint r;
              if (value == null) {
                r = Store(h, ref kn, IntPtr.Zero);
              } else {
                var dv = Us(value);
                IntPtr ps = Marshal.AllocHGlobal(Marshal.SizeOf(typeof(LSA_UNICODE_STRING)));
                try {
                  Marshal.StructureToPtr(dv, ps, false);
                  r = Store(h, ref kn, ps);
                } finally {
                  Marshal.FreeHGlobal(ps);
                  Marshal.FreeHGlobal(dv.Buffer);
                }
              }
              Marshal.FreeHGlobal(kn.Buffer);
              LsaClose(h);
              return LsaNtStatusToWinError(r);
            }
          }
          '@
          Add-Type -TypeDefinition $lsaSrc -ErrorAction Stop

          $reg = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"
          Set-ItemProperty -Path $reg -Name "AutoAdminLogon" -Value "1"
          Set-ItemProperty -Path $reg -Name "DefaultUserName" -Value $env:RDP_USER

          $err = [LsaAutologon]::Set("DefaultPassword", $env:RDP_PASS)
          if ($err -ne 0) { throw "Gagal menyimpan password ke LSA secret (WinError=$err)." }

          Remove-ItemProperty -Path $reg -Name "DefaultPassword" -ErrorAction SilentlyContinue

          New-Item -Path "HKCU:\Software\Policies\Microsoft\Windows\Control Panel\Desktop" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\Software\Policies\Microsoft\Windows\Control Panel\Desktop" -Name "ScreenSaveActive" -Value "0"

      - name: Set RDP Credentials
        env:
          RDP_USER: ${{ secrets.USER }}
          RDP_PASS: ${{ secrets.PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_USER))  { throw "Secret 'USER' belum diatur." }
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASS))  { throw "Secret 'PASSWORD' belum diatur." }

          $user     = $env:RDP_USER
          $password = $env:RDP_PASS

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $user -Password $securePassword -ErrorAction Stop
          } else {
              Set-LocalUser -Name $user -Password $securePassword -ErrorAction Stop
          }

          $inGroup = Get-LocalGroupMember -Group "Administrators" -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -like "*\$user" }
          if (-not $inGroup) { Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction Stop }

          net accounts /maxpwage:unlimited
          Write-Host "[+] User lokal dibuat/diperbarui dan dimasukkan ke Administrators."

      - name: Save Tunnel Credentials
        env:
          TCP_CREDENTIALS: ${{ secrets.TCP_CREDENTIALS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TCP_CREDENTIALS)) {
            throw "Secret 'TCP_CREDENTIALS' belum diatur."
          }
          New-Item -ItemType Directory -Path "$env:USERPROFILE\.cloudflared" -Force
          # Out-File utf8 menulis BOM; cloudflared JSON parser bisa gagal karena BOM.
          # Tulis tanpa BOM supaya kredensial selalu terbaca valid.
          [System.IO.File]::WriteAllText("$env:USERPROFILE\.cloudflared\tcp_tunnel.json", $env:TCP_CREDENTIALS)

      - name: Write Watchdog Script
        run: |
          $wd = @'
          # ============================================================
          # Watchdog tunnel v8 FAST
          # Kalibrasi live di runner (diukur, bukan teori):
          #   /ready endpoint latency : median 2-3ms  -> polling 1s gratis
          #   loop reaksi putus       : 0.4s (bench: fault t=5.0s, alarm t=5.37s)
          # Budget deteksi v8:
          #   proses mati / metrics mati : 1-2 detik  (v7: 5-60s, v5/v6: tidak terdeteksi)
          #   /ready non-200 (edge putus): 8s self-heal window, lalu restart
          #   zombie (E2E mati total)    : 2x gagal x 5s = 10-13 detik -> hard reset
          # Anti-thrash: >3x stuck dalam 5 menit -> grace naik ke 30s.
          # ============================================================
          $cfExe       = "$env:USERPROFILE\cloudflared.exe"
          $credFile    = "$env:USERPROFILE\.cloudflared\tcp_tunnel.json"
          $logFile     = "$env:USERPROFILE\cloudflared.log"
          $hbFile      = "$env:USERPROFILE\cf-watchdog.hb"
          $metricsPort = 2000
          $protocol    = if ($env:CF_PROTOCOL) { $env:CF_PROTOCOL } else { 'quic' }
          $global:CloudflaredLog = $logFile

          # --- tuning (hasil kalibrasi di mesin ini) ---
          $pollMs         = 1000   # polling /ready - reaksi terukur 0.4s
          $bootWaitSec    = 10     # grace setelah start baru (metrics butuh waktu up)
          $stuckFastSec   = 8      # /ready non-200: tunggu self-reconnect internal dulu
          $stuckSlowSec   = 30     # flap berulang: grace panjang
          $flapWindowSec  = 300
          $flapLimit      = 3
          $e2eEveryTicks  = 5      # E2E tiap 5 detik (5 tick x 1s)
          $e2eTimeoutMs   = 3000
          $e2eFailLimit   = 2      # 2x berturut = zombie -> hard reset
          $hbStaleSec     = 60

          function Send-Heartbeat {
            Set-Content -Path $hbFile -Value (Get-Date -Format 'o') -ErrorAction SilentlyContinue
          }

          function Sleep-With-Heartbeat([int]$seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              Send-Heartbeat
              $remaining = [int][Math]::Ceiling(($deadline - (Get-Date)).TotalSeconds)
              if ($remaining -le 0) { break }
              Start-Sleep -Seconds ([Math]::Min(10, $remaining))
            }
            Send-Heartbeat
          }

          function Write-Log([string]$msg) {
            $line = "[{0}] {1}" -f (Get-Date -Format 'HH:mm:ss'), $msg
            Write-Host $line
            Add-Content -Path $logFile -Value $line -ErrorAction SilentlyContinue
          }

          function Start-Tunnel {
            Write-Log "[*] Starting cloudflared (protocol=$protocol)..."
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $cfExe
            $psi.Arguments = "tunnel --no-autoupdate --metrics 127.0.0.1:$metricsPort --credentials-file `"$credFile`" --protocol $protocol run tcp"
            $psi.WindowStyle = [System.Diagnostics.ProcessWindowStyle]::Hidden
            $psi.CreateNoWindow = $true
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::Start($psi)
            $p.BeginOutputReadLine()
            $p.BeginErrorReadLine()
            Register-ObjectEvent -InputObject $p -EventName OutputDataReceived -Action {
              Add-Content -Path $global:CloudflaredLog -Value $Event.SourceEventArgs.Data
            } | Out-Null
            Register-ObjectEvent -InputObject $p -EventName ErrorDataReceived -Action {
              Add-Content -Path $global:CloudflaredLog -Value $Event.SourceEventArgs.Data
            } | Out-Null
            return $p
          }

          function Stop-Tunnel($p) {
            try {
              if ($p -and -not $p.HasExited) {
                $p.Kill()
                $null = $p.WaitForExit(15000)
              }
            } catch {}
            try {
              Get-EventSubscriber -ErrorAction SilentlyContinue |
                Where-Object { $_.SourceObject -eq $p } |
                ForEach-Object {
                  Unregister-Event -SourceIdentifier $_.SourceIdentifier -Force -ErrorAction SilentlyContinue
                  Remove-Job -Id $_.Action.Id -Force -ErrorAction SilentlyContinue
                }
            } catch {}
            $deadline = (Get-Date).AddSeconds(15)
            while ((Get-Date) -lt $deadline) {
              $busy = Get-NetTCPConnection -LocalPort $metricsPort -State Listen -ErrorAction SilentlyContinue
              if (-not $busy) { return }
              Start-Sleep -Milliseconds 400
            }
            Get-NetTCPConnection -LocalPort $metricsPort -State Listen -ErrorAction SilentlyContinue |
              ForEach-Object {
                try { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue } catch {}
              }
          }

          function Test-Ready {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:$metricsPort/ready" -UseBasicParsing -TimeoutSec 2
              return ($r.StatusCode -eq 200)
            } catch { return $false }
          }

          function Get-MetricsText {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:$metricsPort/metrics" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -ne 200) { return $null }
              return $r.Content
            } catch { return $null }
          }

          # exited  - proses mati
          # nometa  - metrics tidak terbaca (proses hang / port bentrok)
          # stuck   - /ready non-200 (tidak ada koneksi aktif ke edge)
          # ok      - sehat
          function Get-TunnelState {
            if ($null -eq $proc -or $proc.HasExited) { return 'exited' }
            $metrics = Get-MetricsText
            if ($null -eq $metrics) { return 'nometa' }
            if (-not (Test-Ready)) { return 'stuck' }
            $connLine = $null
            foreach ($line in ($metrics -split "`n")) {
              if ($line -match '^\s*cloudflared_tunnel_ha_connections\s') { $connLine = $line; break }
            }
            if ($null -ne $connLine) {
              $tok = ($connLine -split '\s+')[-1]
              if ($tok -match '^[0-9]' -and [double]$tok -le 0) { return 'stuck' }
            }
            return 'ok'
          }

          function Test-E2E {
            if ([string]::IsNullOrWhiteSpace($env:RDP_HOSTNAME)) { return 'skip' }
            $c = New-Object System.Net.Sockets.TcpClient
            try {
              $ar = $c.BeginConnect($env:RDP_HOSTNAME, 3389, $null, $null)
              if (-not $ar.AsyncWaitHandle.WaitOne($e2eTimeoutMs, $false)) { return 'fail' }
              $c.EndConnect($ar)
              return 'ok'
            } catch { return 'fail' }
            finally { $c.Close() }
          }

          function Test-RDP {
            try {
              $c = New-Object System.Net.Sockets.TcpClient
              $ar = $c.BeginConnect('127.0.0.1', 3389, $null, $null)
              $ok = $ar.AsyncWaitHandle.WaitOne(2000, $false)
              if ($ok) { $c.EndConnect($ar) }
              $c.Close()
              return [bool]$ok
            } catch { return $false }
          }

          function Ensure-RDP {
            $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue
            if ($svc.Status -ne 'Running') {
              Write-Log "[!] TermService not running, restarting..."
              Start-Service TermService
              Start-Sleep 3
            }
          }

          function Hard-Reset([string]$reason) {
            Write-Log "[!] HARD RESET ($reason) - flush DNS, flip protocol, restart"
            Stop-Tunnel $proc
            Clear-DnsClientCache -ErrorAction SilentlyContinue
            $script:protocol = if ($protocol -eq 'quic') { 'http2' } else { 'quic' }
            $script:proc = Start-Tunnel
            $script:bootUntil = (Get-Date).AddSeconds($bootWaitSec)
            $script:stateSince = Get-Date
          }

          Write-Log "[+] Watchdog v8 FAST started (protocol=$protocol)"
          Write-Log "    Credentials: see USER / PASSWORD repo secrets."

          $backoff        = 3
          $maxBackoff     = 30
          $lastTunnelUp   = $true
          $lastRdpUp      = $true
          $stateSince     = $null
          $bootUntil      = (Get-Date).AddSeconds($bootWaitSec)
          $flaps          = @()
          $tick           = 0
          $e2eFails       = 0
          $e2eSkipLogged  = $false
          $hardResets     = 0
          $lastHardResetAt = $null
          $lastE2eOkAt    = Get-Date
          $proc = Start-Tunnel
          Send-Heartbeat

          while ($true) {
            try {
              Send-Heartbeat
              $tick++

              # --- boot grace: metrics butuh waktu up setelah start ---
              if ((Get-Date) -lt $bootUntil) {
                Start-Sleep -Milliseconds $pollMs
                continue
              }

              $state    = Get-TunnelState
              $tunnelOk = ($state -eq 'ok')

              if ($tunnelOk) {
                if (-not $lastTunnelUp) {
                  $dur = if ($stateSince) { [int]((Get-Date) - $stateSince).TotalSeconds } else { -1 }
                  Write-Log "[+] Tunnel RECOVERED (down ~${dur}s)"
                }
                $stateSince = $null
                $lastTunnelUp = $true
                $backoff = 3
              } else {
                if ($null -eq $stateSince) { $stateSince = Get-Date }
                $downFor = [int]((Get-Date) - $stateSince).TotalSeconds
                if ($lastTunnelUp) { Write-Log "[!] Tunnel DOWN ($state) - detecting..." }

                # exited / nometa: proses sudah mati atau hang -> restart SEGERA
                # stuck: beri jendela self-reconnect sesuai riwayat flap
                $grace = $stuckFastSec
                if ($state -eq 'stuck') {
                  $flaps = @($flaps | Where-Object { ((Get-Date) - $_).TotalSeconds -lt $flapWindowSec })
                  if ($flaps.Count -ge $flapLimit) { $grace = $stuckSlowSec }
                }

                if ($state -ne 'stuck' -or $downFor -ge $grace) {
                  $latency = "{0:N1}s" -f ((Get-Date) - $stateSince).TotalSeconds
                  Write-Log "[!] DETECTED after ${latency} ($state) -> restart now"
                  Stop-Tunnel $proc
                  Clear-DnsClientCache -ErrorAction SilentlyContinue
                  $proc = Start-Tunnel
                  # reset jam down: setelah restart baru, kasih jendela
                  # self-reconnect penuh lagi (8s/30s). Tanpa ini downFor
                  # mewarisi usia episode lama -> cloudflared dibunuh 0 detik
                  # setelah boot, padahal butuh 10-15s untuk handshake edge
                  # di jaringan buruk.
                  $stateSince = Get-Date
                  # tidak boleh menghajar edge dengan restart tiap 10 detik
                  $bootUntil = (Get-Date).AddSeconds($bootWaitSec + $backoff)
                  $backoff = [Math]::Min($backoff * 2, $maxBackoff)
                  if ($state -eq 'stuck') { $flaps += Get-Date }
                } else {
                  if ($downFor % 2 -eq 0) {
                    Write-Log "[!] stuck ${downFor}/${grace}s - letting cloudflared self-reconnect (flap=$($flaps.Count))"
                  }
                }
                $lastTunnelUp = $false
              }

              # --- RDP lokal (tiap 5 detik) ---
              if ($tick % 5 -eq 0) {
                $rdpOk = Test-RDP
                if (-not $rdpOk) {
                  if ($lastRdpUp) { Write-Log "[!] RDP port 3389 DOWN - fixing..." }
                  Ensure-RDP
                } elseif (-not $lastRdpUp) { Write-Log "[+] RDP recovered!" }
                $lastRdpUp = $rdpOk
              }

              # --- E2E anti-zombie (hanya saat lokal bilang SEHAT) ---
              # Kalau lokal bilang sehat tapi jalur publik mati = socket
              # setengah mati. 2x gagal x 5s = ~10-13 detik -> hard reset.
              if ($tick % $e2eEveryTicks -eq 0) {
                $e2e = Test-E2E
                if ($e2e -eq 'skip') {
                  if (-not $e2eSkipLogged) {
                    $e2eSkipLogged = $true
                    Write-Log "[i] RDP_HOSTNAME belum diatur - E2E anti-zombie nonaktif."
                  }
                } elseif ($e2e -eq 'ok') {
                  if ($e2eFails -ge $e2eFailLimit) { Write-Log "[+] E2E recovered (user path OK)" }
                  $e2eFails = 0
                  $lastE2eOkAt = Get-Date
                  if ($hardResets -gt 0) { $hardResets = 0; $lastHardResetAt = $null }
                } else {
                  $e2eFails++
                  if ($tunnelOk) {
                    Write-Log "[!] E2E FAIL $e2eFails/$e2eFailLimit (${env:RDP_HOSTNAME}:3389) local=OK -> ZOMBIE?"
                    if ($e2eFails -ge $e2eFailLimit) {
                      $e2eFails = 0
                      $sinceLast = if ($lastHardResetAt) { ((Get-Date) - $lastHardResetAt).TotalSeconds } else { 9999 }
                      if ($hardResets -ge 4 -and $sinceLast -lt 300) {
                        Write-Log "[!] E2E still dead - cooldown hard reset ($([int]$sinceLast)/300s)"
                      } else {
                        $hardResets++
                        $lastHardResetAt = Get-Date
                        Hard-Reset "zombie #${hardResets}: /ready OK tapi user path mati"
                      }
                    }
                  }
                  # lokal sedang down: biarkan layer lokal yang handle (hindari double-restart)
                }
              }

              Start-Sleep -Milliseconds $pollMs
            } catch {
              Write-Log "[!] Watchdog loop error (recovered): $($_.Exception.Message)"
              Start-Sleep -Seconds 1
            }
          }
          '@
          Set-Content -Path "$env:USERPROFILE\watchdog.ps1" -Value $wd -Encoding utf8
          Write-Host "[+] Watchdog v8 written to $env:USERPROFILE\watchdog.ps1"
      - name: Run Tunnel Supervisor
        env:
          TCP_CREDENTIALS: ${{ secrets.TCP_CREDENTIALS }}
          RDP_HOSTNAME: ${{ secrets.RDP_HOSTNAME }}
        run: |
          # Supervisor v8: heartbeat watchdog dicek tiap 5 detik (bukan 10),
          # stale 60s -> bunuh dan spawn ulang. Watchdog tidak bisa mati
          # diam-diam, dan hook GITHUB_STEP_SUMMARY dipakai untuk auto
          # re-dispatch sebelum limit 6 jam (dilakukan di langkah terpisah).
          $wdPath      = "$env:USERPROFILE\watchdog.ps1"
          $hbFile      = "$env:USERPROFILE\cf-watchdog.hb"
          $hbStaleSec  = 60
          $outLog      = "$env:USERPROFILE\watchdog.out.log"
          $errLog      = "$env:USERPROFILE\watchdog.err.log"
          $supBackoff  = 5
          $maxSupBack  = 30

          Write-Host "===================================="
          Write-Host "[+] Supervisor v8 started (fast detection)"
          Write-Host "    Credentials: see the USER and PASSWORD repository secrets."
          Write-Host "===================================="

          while ($true) {
            Remove-Item $hbFile -Force -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath "pwsh.exe" `
                 -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$wdPath) `
                 -PassThru -WindowStyle Hidden `
                 -RedirectStandardOutput $outLog -RedirectStandardError $errLog
            Write-Host "[*] Watchdog v8 PID $($p.Id) started"
            $watchdogStart = Get-Date
            $hbGraceSec    = 90
            $hbWarned      = $false

            while (-not $p.HasExited) {
              Start-Sleep -Seconds 5
              $hbOk = $false
              if (Test-Path $hbFile) {
                try {
                  $ts = [datetime]::Parse((Get-Content $hbFile -Raw).Trim())
                  if (((Get-Date) - $ts).TotalSeconds -le $hbStaleSec) { $hbOk = $true }
                } catch {}
              }
              if ($hbOk) { $hbWarned = $false; continue }

              $ageSec = [int]((Get-Date) - $watchdogStart).TotalSeconds
              if ($ageSec -le $hbGraceSec) { continue }
              if (-not $hbWarned) {
                Write-Host "[!] Watchdog heartbeat missing/stale (${ageSec}s) - may be hung"
                $hbWarned = $true
              }
              if ($ageSec -gt ($hbStaleSec + $hbGraceSec)) {
                Write-Host "[!] Killing hung watchdog PID $($p.Id)"
                try { $p.Kill(); $null = $p.WaitForExit(10000) } catch {}
                break
              }
            }

            $exitInfo = if ($p.HasExited) { "exit code $($p.ExitCode)" } else { 'killed' }
            Write-Host "[!] Watchdog stopped ($exitInfo) - restarting in ${supBackoff}s"
            Start-Sleep -Seconds $supBackoff
            if ($p.StartTime -and ((Get-Date) - $p.StartTime).TotalMinutes -ge 5) { $supBackoff = 5 }
            else { $supBackoff = [Math]::Min($supBackoff * 2, $maxSupBack) }
          }
      - name: Cleanup
        if: always()
        run: |
          Get-Process cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-CimInstance Win32_Process -Filter "Name='pwsh.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -match 'watchdog\.ps1' } |
            ForEach-Object { try { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } catch {} }
          Remove-Item "$env:USERPROFILE\.cloudflared\tcp_tunnel.json" -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\cf-watchdog.hb" -Force -ErrorAction SilentlyContinue
